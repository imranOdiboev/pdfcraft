name: ODIBO README showcase validation
on:
  push:
    branches: [feature/odibo-readme-showcase]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odibo-showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Generate attribution through the repository tool
        run: |
          mkdir -p dist/showcase
          cargo xtask assets --write
          git diff --binary -- ATTRIBUTION.md > dist/showcase/attribution.patch
      - name: Asset licences, provenance and hashes
        run: cargo xtask assets
      - name: README links, headings and permanent image references
        run: python3 packaging/check_odibo_readme.py > dist/showcase/links.json
      - name: Require generated attribution committed
        run: test ! -s dist/showcase/attribution.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-showcase-validation-${{ github.sha }}
          path: dist/showcase
          retention-days: 7
          if-no-files-found: error
