name: ODIBO editor workspace acceptance

on:
  push:
    branches: [feature/odibo-editor-workspace]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odibo-editor-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
          persist-credentials: false
      - name: Linux dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Prepare formatting patch without local Rust installation
        run: |
          mkdir -p dist/editor-qa
          cargo fmt --all
          git diff --binary -- '*.rs' > dist/editor-qa/format.patch
      - name: Clippy
        run: cargo clippy --locked -p pdfcraft-ui-egui --all-targets -- -D warnings
      - name: UI tests
        run: |
          cargo test --locked -p pdfcraft-ui-egui --test ui_group --no-fail-fast
          cargo test --locked -p pdfcraft-ui-egui --lib --test commands --test create --test ui --test control --test dialog_chrome --test accessibility --test actions --test editing --test javascript --test signing --test prepare --test viewer --test view --test pickers --test folders --no-fail-fast
      - name: Prove navigation regression without the new navigation view
        run: |
          cp crates/ui-egui/src/lib.rs "$RUNNER_TEMP/editor-lib-fixed.rs"
          trap 'cp "$RUNNER_TEMP/editor-lib-fixed.rs" crates/ui-egui/src/lib.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ui-egui/src/lib.rs')
          s = p.read_text()
          line = '            editor_navigation::show(self, ui);'
          assert s.count(line) == 1
          p.write_text(s.replace(line, ''))
          PY
          set +e
          cargo test --locked -p pdfcraft-ui-egui --test ui_group fresh_editor_places_navigation_left_and_tools_right > dist/editor-qa/negative-control.log 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/editor-lib-fixed.rs" crates/ui-egui/src/lib.rs
          trap - EXIT
          test "$status" -ne 0
          grep -F 'editor_workspace::fresh_editor_places_navigation_left_and_tools_right ... FAILED' dist/editor-qa/negative-control.log
          cargo test --locked -p pdfcraft-ui-egui --test ui_group fresh_editor_places_navigation_left_and_tools_right
      - name: Real egui editor screenshots using a synthetic document
        if: ${{ !cancelled() }}
        env:
          PDFCRAFT_SYSTEM_FONTS: '0'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R 4 0 R] /Count 2 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << >> /Contents 5 0 R >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>', b'<< /Length 55 >>\nstream\n0.9 0.94 1 rg 60 620 475 140 re f 0 0.36 0.9 rg 60 620 8 140 re f\nendstream']
          # No text/fonts/images in the PDF: only original vector rectangles.
          stream = objects[4].split(b'stream\n')[1].split(b'\nendstream')[0]
          objects[4] = b'<< /Length ' + str(len(stream)).encode() + b' >>\nstream\n' + stream + b'\nendstream'
          out = bytearray(b'%PDF-1.7\n'); offsets = []
          for i, obj in enumerate(objects, 1):
              offsets.append(len(out)); out.extend(f'{i} 0 obj\n'.encode() + obj + b'\nendobj\n')
          xref = len(out)
          out.extend(f'xref\n0 {len(objects)+1}\n0000000000 65535 f \n'.encode())
          for offset in offsets: out.extend(f'{offset:010d} 00000 n \n'.encode())
          out.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('dist/editor-qa/fixture.pdf').write_bytes(out)
          PY
          for language in en ru; do
            for theme in light dark; do
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/editor-$language-$theme.png dist/editor-qa/fixture.pdf --scale 1 --language $language --theme $theme --mode edit --tool edit --quick edit-text
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/context-$language-$theme.png dist/editor-qa/fixture.pdf --scale 1 --language $language --theme $theme --mode edit --tool edit --quick edit-text --panel comments
            done
          done
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/editor-minimum-light.png dist/editor-qa/fixture.pdf --size 820x520 --scale 1.5 --language ru --theme light --mode edit
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/editor-minimum-dark.png dist/editor-qa/fixture.pdf --size 820x520 --scale 2 --language ru --theme dark --mode edit
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/navigation-minimum-light.png dist/editor-qa/fixture.pdf --size 820x520 --scale 1.5 --language ru --theme light --mode edit --click 'Навигация по страницам: Страницы'
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/navigation-minimum-dark.png dist/editor-qa/fixture.pdf --size 820x520 --scale 2 --language ru --theme dark --mode edit --click 'Навигация по страницам: Страницы'
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/read-minimum-light.png dist/editor-qa/fixture.pdf --size 820x520 --scale 1.5 --language ru --theme light --mode read --panel comments
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/editor-qa/read-minimum-dark.png dist/editor-qa/fixture.pdf --size 820x520 --scale 2 --language ru --theme dark --mode read --panel comments
          cp assets/odibo/LICENSE-ODIBO-BRAND.txt dist/editor-qa/
          cp LICENSE-MIT LICENSE-APACHE NOTICE dist/editor-qa/
          cp assets/fonts/OFL-Inter.txt assets/fonts/OFL-JetBrainsMono.txt assets/icons/LICENSE-lucide.txt dist/editor-qa/
          echo 'Own egui screenshots and synthetic vector PDF: MIT OR Apache-2.0; ODIBO marks: LicenseRef-ODIBO-Brand. UI fonts: Inter/OFL; icons: Lucide/ISC. Source:' > dist/editor-qa/PROVENANCE.txt
          echo "$GITHUB_SHA" >> dist/editor-qa/PROVENANCE.txt
          sha256sum dist/editor-qa/*.png dist/editor-qa/fixture.pdf > dist/editor-qa/SHA256SUMS.txt
      - name: Layering and assets
        if: ${{ !cancelled() }}
        run: |
          cargo xtask layers
          cargo xtask assets
          cargo xtask parity
      - name: Require formatting patch to be applied to the branch
        if: ${{ !cancelled() }}
        run: test ! -s dist/editor-qa/format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-editor-${{ github.sha }}
          path: dist/editor-qa
          retention-days: 7
          if-no-files-found: error
