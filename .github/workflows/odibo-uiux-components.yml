name: ODIBO Home acceptance

on:
  push:
    branches: [feature/odibo-home]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odibo-home-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
          persist-credentials: false
      - name: Linux dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Prepare formatting patch without local Rust installation
        run: |
          mkdir -p dist/home-qa
          cargo fmt --all
          git diff --binary -- '*.rs' > dist/home-qa/format.patch
      - name: Clippy
        run: cargo clippy --locked -p pdfcraft-ui-egui --all-targets -- -D warnings
      - name: UI tests
        run: cargo test --locked -p pdfcraft-ui-egui --lib --test ui_group --test commands --test ui --test control --test dialog_chrome --test accessibility --test actions --test editing --test javascript --test signing --test pickers --test folders --no-fail-fast
      - name: Prove Home regression against merged stage 3.2
        run: |
          git fetch --no-tags --depth=1 origin 15b62cfd88693129f75ec9d6308f4ab147a8d241
          cp crates/ui-egui/src/home.rs "$RUNNER_TEMP/home-fixed.rs"
          trap 'cp "$RUNNER_TEMP/home-fixed.rs" crates/ui-egui/src/home.rs' EXIT
          git show 15b62cfd88693129f75ec9d6308f4ab147a8d241:crates/ui-egui/src/home.rs > crates/ui-egui/src/home.rs
          set +e
          cargo test --locked -p pdfcraft-ui-egui --test ui_group home_combine_card_opens_existing_combine_workspace > dist/home-qa/negative-control.log 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/home-fixed.rs" crates/ui-egui/src/home.rs
          trap - EXIT
          test "$status" -ne 0
          grep -F 'home::home_combine_card_opens_existing_combine_workspace ... FAILED' dist/home-qa/negative-control.log
          cargo test --locked -p pdfcraft-ui-egui --test ui_group home_combine_card_opens_existing_combine_workspace
      - name: Real egui Home screenshots with empty and synthetic recent states
        if: ${{ !cancelled() }}
        env:
          PDFCRAFT_SYSTEM_FONTS: '0'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R 4 0 R] /Count 2 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << >> /Contents 5 0 R >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>', b'<< /Length 55 >>\nstream\n0.9 0.94 1 rg 60 620 475 140 re f 0 0.36 0.9 rg 60 620 8 140 re f\nendstream']
          # No text/fonts/images in the PDF: only original vector rectangles.
          stream = objects[4].split(b'stream\n')[1].split(b'\nendstream')[0]
          objects[4] = b'<< /Length ' + str(len(stream)).encode() + b' >>\nstream\n' + stream + b'\nendstream'
          out = bytearray(b'%PDF-1.7\n'); offsets = []
          for i, obj in enumerate(objects, 1):
              offsets.append(len(out)); out.extend(f'{i} 0 obj\n'.encode() + obj + b'\nendobj\n')
          xref = len(out)
          out.extend(f'xref\n0 {len(objects)+1}\n0000000000 65535 f \n'.encode())
          for offset in offsets: out.extend(f'{offset:010d} 00000 n \n'.encode())
          out.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('dist/home-qa/fixture.pdf').write_bytes(out)
          PY
          for language in en ru; do
            for theme in light dark; do
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/home-qa/home-$language-$theme.png --scale 1 --language $language --theme $theme
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/home-qa/recent-$language-$theme.png dist/home-qa/fixture.pdf --home true --scale 1 --language $language --theme $theme
            done
          done
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/home-qa/home-minimum-light.png --size 820x520 --scale 1.5 --language ru --theme light
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/home-qa/home-minimum-dark.png --size 820x520 --scale 2 --language ru --theme dark
          cp assets/odibo/LICENSE-ODIBO-BRAND.txt dist/home-qa/
          cp LICENSE-MIT LICENSE-APACHE NOTICE dist/home-qa/
          cp assets/fonts/OFL-Inter.txt assets/fonts/OFL-JetBrainsMono.txt assets/icons/LICENSE-lucide.txt dist/home-qa/
          echo 'Own egui screenshots and synthetic vector PDF: MIT OR Apache-2.0; ODIBO marks: LicenseRef-ODIBO-Brand. UI fonts: Inter/OFL; icons: Lucide/ISC. Source:' > dist/home-qa/PROVENANCE.txt
          echo "$GITHUB_SHA" >> dist/home-qa/PROVENANCE.txt
          sha256sum dist/home-qa/*.png dist/home-qa/fixture.pdf > dist/home-qa/SHA256SUMS.txt
      - name: Layering and assets
        if: ${{ !cancelled() }}
        run: |
          cargo xtask layers
          cargo xtask assets
          cargo xtask parity
      - name: Require formatting patch to be applied to the branch
        if: ${{ !cancelled() }}
        run: test ! -s dist/home-qa/format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-home-${{ github.sha }}
          path: dist/home-qa
          retention-days: 7
          if-no-files-found: error
