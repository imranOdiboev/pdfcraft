name: ODIBO reproducible CLI measurements
on:
  push:
    branches: [feature/odibo-beta-readiness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odibo-beta-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Compile once before any measurements
        run: cargo build --locked --release -p pdfcraft-cli
      - name: Fresh-process CLI measurements on Linux
        if: runner.os == 'Linux'
        run: python3 packaging/odibo_beta_benchmark.py --cli target/release/odibo-pdf-cli --out dist/beta-measurements
      - name: Fresh-process CLI measurements on Windows
        if: runner.os == 'Windows'
        run: python packaging/odibo_beta_benchmark.py --cli target/release/odibo-pdf-cli.exe --out dist/beta-measurements
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: odibo-beta-measurements-${{ runner.os }}-${{ github.sha }}
          path: dist/beta-measurements/measurements.json
          retention-days: 7
          if-no-files-found: error
