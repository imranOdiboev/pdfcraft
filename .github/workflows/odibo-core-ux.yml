name: ODIBO core PDF tools acceptance

on:
  push:
    branches: [feature/odibo-core-ux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odibo-core-ux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
          persist-credentials: false
      - name: Linux dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Prepare formatting patch without local Rust installation
        run: |
          mkdir -p dist/core-ux-qa
          cargo fmt --all
          git diff --binary -- '*.rs' > dist/core-ux-qa/format.patch
      - name: Clippy
        run: cargo clippy --locked -p pdfcraft-ui-egui --all-targets -- -D warnings
      - name: UI tests
        run: |
          cargo test --locked -p pdfcraft-ui-egui --test ui_group --no-fail-fast
          cargo test --locked -p pdfcraft-ui-egui --lib --test commands --test create --test ui --test control --test dialog_chrome --test accessibility --test actions --test editing --test javascript --test signing --test prepare --test viewer --test view --test pickers --test folders --test combine_grid --no-fail-fast
      - name: Prove no-clobber regression with the old writer
        run: |
          cp crates/ui-egui/src/files.rs "$RUNNER_TEMP/core-files-fixed.rs"
          trap 'cp "$RUNNER_TEMP/core-files-fixed.rs" crates/ui-egui/src/files.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ui-egui/src/files.rs')
          s = p.read_text()
          original = 'write_new_pdf(&existing, b"replacement")'
          assert s.count(original) == 1
          # Exercise the former overwrite writer against exactly the same existing file.
          s = s.replace(original, 'crate::editing::write_atomically(&existing.to_string_lossy(), b"replacement")')
          p.write_text(s)
          PY
          set +e
          cargo test --locked -p pdfcraft-ui-egui --lib split_outputs_never_replace_existing_files_or_write_on_preflight_failure > dist/core-ux-qa/negative-control.log 2>&1
          status=$?
          set -e
          cp "$RUNNER_TEMP/core-files-fixed.rs" crates/ui-egui/src/files.rs
          trap - EXIT
          test "$status" -ne 0
          grep -F 'split_outputs_never_replace_existing_files_or_write_on_preflight_failure ... FAILED' dist/core-ux-qa/negative-control.log
          cargo test --locked -p pdfcraft-ui-egui --lib split_outputs_never_replace_existing_files_or_write_on_preflight_failure
      - name: Real egui editor screenshots using a synthetic document
        if: ${{ !cancelled() }}
        env:
          PDFCRAFT_SYSTEM_FONTS: '0'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R 4 0 R] /Count 2 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << >> /Contents 5 0 R >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>', b'<< /Length 55 >>\nstream\n0.9 0.94 1 rg 60 620 475 140 re f 0 0.36 0.9 rg 60 620 8 140 re f\nendstream']
          # No text/fonts/images in the PDF: only original vector rectangles.
          stream = objects[4].split(b'stream\n')[1].split(b'\nendstream')[0]
          objects[4] = b'<< /Length ' + str(len(stream)).encode() + b' >>\nstream\n' + stream + b'\nendstream'
          out = bytearray(b'%PDF-1.7\n'); offsets = []
          for i, obj in enumerate(objects, 1):
              offsets.append(len(out)); out.extend(f'{i} 0 obj\n'.encode() + obj + b'\nendobj\n')
          xref = len(out)
          out.extend(f'xref\n0 {len(objects)+1}\n0000000000 65535 f \n'.encode())
          for offset in offsets: out.extend(f'{offset:010d} 00000 n \n'.encode())
          out.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('dist/core-ux-qa/fixture.pdf').write_bytes(out)
          PY
          for language in en ru; do
            for theme in light dark; do
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/organize-$language-$theme.png dist/core-ux-qa/fixture.pdf --scale 1 --language $language --theme $theme --tool organize --organize on
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/split-$language-$theme.png dist/core-ux-qa/fixture.pdf --scale 1 --language $language --theme $theme --dialog split --split-ranges 1,2
              cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/combine-$language-$theme.png dist/core-ux-qa/fixture.pdf --scale 1 --language $language --theme $theme --combine-fixture yes
            done
          done
          for scale in 1 1.5 2; do
            cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/split-minimum-$scale.png dist/core-ux-qa/fixture.pdf --size 820x520 --scale $scale --language ru --theme dark --dialog split --split-ranges 1,2
          done
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/combine-minimum-light.png dist/core-ux-qa/fixture.pdf --size 820x520 --scale 1.5 --language ru --theme light --combine-fixture yes
          cargo run --locked -p pdfcraft-ui-egui --example shot -- dist/core-ux-qa/organize-minimum-dark.png dist/core-ux-qa/fixture.pdf --size 820x520 --scale 2 --language ru --theme dark --tool organize --organize on --click 'Инструменты'
          cp assets/odibo/LICENSE-ODIBO-BRAND.txt dist/core-ux-qa/
          cp LICENSE-MIT LICENSE-APACHE NOTICE dist/core-ux-qa/
          cp assets/fonts/OFL-Inter.txt assets/fonts/OFL-JetBrainsMono.txt assets/icons/LICENSE-lucide.txt dist/core-ux-qa/
          echo 'Own egui screenshots and synthetic vector PDF: MIT OR Apache-2.0; ODIBO marks: LicenseRef-ODIBO-Brand. UI fonts: Inter/OFL; icons: Lucide/ISC. Source:' > dist/core-ux-qa/PROVENANCE.txt
          echo "$GITHUB_SHA" >> dist/core-ux-qa/PROVENANCE.txt
          sha256sum dist/core-ux-qa/*.png dist/core-ux-qa/fixture.pdf > dist/core-ux-qa/SHA256SUMS.txt
      - name: Layering and assets
        if: ${{ !cancelled() }}
        run: |
          cargo xtask layers
          cargo xtask assets
          cargo xtask parity
      - name: Require formatting patch to be applied to the branch
        if: ${{ !cancelled() }}
        run: test ! -s dist/core-ux-qa/format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-core-ux-${{ github.sha }}
          path: dist/core-ux-qa
          retention-days: 7
          if-no-files-found: error
