name: ODIBO isolated source preparation

on:
  push:
    branches: [feature/odibo-rebranding, feature/odibo-uiux, feature/odibo-home, feature/odibo-editor-workspace, feature/odibo-core-ux, feature/odibo-uiux-polish, feature/odibo-beta-readiness, feature/odibo-readme-showcase]
  workflow_dispatch:
    inputs:
      prepare_security_patch:
        description: Resolve targeted security updates on the disposable runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Prepare formatting and generated attribution on the disposable runner
        run: |
          mkdir -p dist/preparation
          trap 'git diff --binary -- "*.rs" ATTRIBUTION.md Cargo.lock > dist/preparation/preparation.patch' EXIT
          if [ '${{ inputs.prepare_security_patch }}' = 'true' ]; then
            case "$GITHUB_REF" in
              refs/heads/feature/odibo-core-ux)
                cargo update -p crypto-bigint@0.7.5 --precise 0.7.6
                ;;
              refs/heads/feature/odibo-editor-workspace)
                cargo update -p ctutils --precise 0.4.4
                cargo update -p clipboard-win
                ;;
              *) exit 1 ;;
            esac
          fi
          cargo fmt --all
          cargo xtask assets --write
          cargo test --locked -p xtask assets::tests
          cargo xtask parity
          mkdir -p dist/preparation
          git diff --binary -- '*.rs' ATTRIBUTION.md Cargo.lock > dist/preparation/preparation.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-preparation-${{ github.sha }}
          path: dist/preparation
          retention-days: 3
          if-no-files-found: error
