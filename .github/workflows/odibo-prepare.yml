name: ODIBO isolated source preparation

on:
  push:
    branches: [feature/odibo-rebranding, feature/odibo-uiux, feature/odibo-home, feature/odibo-editor-workspace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Prepare formatting and generated attribution on the disposable runner
        run: |
          mkdir -p dist/preparation
          trap 'git diff --binary -- "*.rs" ATTRIBUTION.md > dist/preparation/preparation.patch' EXIT
          cargo fmt --all
          cargo xtask assets --write
          cargo test --locked -p xtask assets::tests
          cargo xtask parity
          mkdir -p dist/preparation
          git diff --binary -- '*.rs' ATTRIBUTION.md > dist/preparation/preparation.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: odibo-preparation-${{ github.sha }}
          path: dist/preparation
          retention-days: 3
          if-no-files-found: error
