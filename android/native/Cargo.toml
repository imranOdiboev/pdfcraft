[package]
name = "odibo-android-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "odibo_core_exec"
path = "src/main.rs"

[dependencies]
pdfcraft-cos = { path = "../../crates/cos" }
pdfcraft-organize = { path = "../../crates/organize" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "unwind"
strip = true
